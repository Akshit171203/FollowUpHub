openapi: 3.0.0
info:
  title: FollowUpHub API
  description: API documentation for FollowUpHub SaaS platform.
  version: 1.0.0
servers:
  - url: http://localhost:5001
    description: Local development server
  - url: https://followuphub-api.onrender.com
    description: Production server
paths:
  /health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Server is healthy and dependencies are connected
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
  /api/users/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials
