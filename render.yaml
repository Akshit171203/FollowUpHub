services:
  - type: web
    name: followuphub-api
    env: docker
    region: ohio
    rootDir: backend
    plan: free # Change to starter ($7/mo) when scaling
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: DATABASE_URL
        sync: false # Set securely in Render dashboard
      - key: REDIS_URL
        sync: false # Set securely in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: LOGIN_SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: OPSFLOW_URL
        sync: false # Set in the Render dashboard (optional)
      - key: OPSFLOW_API_KEY
        sync: false # Set in the Render dashboard (optional)
      - key: OPSFLOW_SERVICE
        value: followuphub-api
      - key: CLIENT_URL
        value: https://followuphub.vercel.app # Example Vercel URL
